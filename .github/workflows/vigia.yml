# Vigia do backend central e do site (docs/ARQUITETURA.md): de 6 em 6 horas confirma que respondem. Se algum falhar, a
# execução falha e o GitHub avisa por email. Também mantém activo o projecto do Supabase, que no plano gratuito pára ao
# fim de 7 dias sem actividade: cada verificação lê os planos da base de dados.
name: Vigia

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: site-fonte/config.json
          sparse-checkout-cone-mode: false

      - name: Servidor de licenças (função kangest no Supabase)
        run: |
          U=$(jq -r .web.licencas site-fonte/config.json)
          curl -fsS --retry 3 --retry-delay 10 --max-time 30 "$U/" | grep -q '"servico"'
          curl -fsS --retry 3 --retry-delay 10 --max-time 30 "$U/v1/planos" | grep -q '"ok":true'

      - name: Worker antigo (as versões até 1.3.4 falam com ele)
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 30 https://kangest-licencas.valentinocanguele.workers.dev/v1/planos | grep -q '"ok":true'

      - name: Site
        run: |
          S=$(jq -r .site site-fonte/config.json)
          for p in "" admin.html conta.html aderir baixar; do
            curl -fsSL --retry 3 --retry-delay 10 --max-time 30 -o /dev/null "$S/$p" || { echo "$S/$p não responde"; exit 1; }
          done
