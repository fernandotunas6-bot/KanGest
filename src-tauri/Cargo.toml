[package]
name = "kigest"
version = "1.4.2"
description = "KanGest — Gestão Comercial e POS"
authors = ["Valentino Canguele <valentinocanguele@gmail.com>"]
license-file = "../LICENSE"
publish = false
edition = "2021"
rust-version = "1.82"

[lib]
name = "kigest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "net"] }
# Importação do KIGEST: cliente SQL Server (TDS) em Rust puro + TLS nativo do sistema.
tiberius = { version = "0.12", default-features = false, features = ["tds73", "native-tls", "sql-browser-tokio", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
argon2 = "0.5"
rsa = { version = "0.9", features = ["sha1", "pem"] }
sha1 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
# assinatura Ed25519 das licenças do KanGest
ring = "0.17"
rand = "0.8"
# Cliente HTTPS (actualizações e Facturação Electrónica da AGT) com o TLS do sistema; RS256 e SHA-256.
native-tls = "0.2"
sha2 = { version = "0.10", features = ["oid"] }
minisign-verify = "0.2"
# Ficheiros exportados do KIGEST (.kigest = JSON por linhas em gzip).
flate2 = "1"
# Portas em IPv4 e IPv6 ao mesmo tempo (IPV6_V6ONLY desligado também no Windows).
socket2 = "0.6"

# Cofre do sistema para a chave mestra dos segredos: Porta-chaves no macOS e Gestor de Credenciais (DPAPI) no Windows.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
# SQLCipher no Windows: o OpenSSL compila-se junto (o Windows não o traz)
libsqlite3-sys = { version = "0.30", features = ["bundled-sqlcipher-vendored-openssl"] }

# Base de dados cifrada (SQLCipher, AES-256): o SQLite do sqlx passa a ser o SQLCipher. No macOS usa o CommonCrypto da
# Apple; no Linux (CI, desenvolvimento) o libcrypto do sistema.
[target.'cfg(not(target_os = "windows"))'.dependencies]
libsqlite3-sys = { version = "0.30", features = ["bundled-sqlcipher"] }

# Crypto e hashing ficam muito lentos sem optimizações em debug.
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# PBKDF2 da rede entre postos e AES/ChaCha dos segredos
[profile.dev.package.ring]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
