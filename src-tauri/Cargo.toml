[package]
name = "kigest"
version = "1.4.2"
description = "KanGest — Gestão Comercial e POS"
authors = ["Valentino Canguele <valentinocanguele@gmail.com>"]
license-file = "../LICENSE"
publish = false
edition = "2021"
rust-version = "1.82"

[lib]
name = "kigest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "net"] }
# Importação do KIGEST: cliente SQL Server (TDS) em Rust puro + TLS nativo do sistema.
tiberius = { version = "0.12", default-features = false, features = ["tds73", "native-tls", "sql-browser-tokio", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
argon2 = "0.5"
rsa = { version = "0.9", features = ["sha1", "pem"] }
sha1 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
# assinatura Ed25519 das licenças do KanGest
ring = "0.17"
rand = "0.8"
# Cliente HTTPS (actualizações e Facturação Electrónica da AGT) com o TLS do sistema; RS256 e SHA-256.
native-tls = "0.2"
sha2 = { version = "0.10", features = ["oid"] }
minisign-verify = "0.2"
# Ficheiros exportados do KIGEST (.kigest = JSON por linhas em gzip).
flate2 = "1"
# SAF-T (AO) de outros sistemas, lido por fluxo (importação universal). A mesma versão que já vem com o Tauri.
quick-xml = "0.42"
# Folhas de cálculo de outros programas ou feitas à mão (Excel .xlsx/.xls, LibreOffice .ods) e CSV em Windows-1252.
# O calamine usa o mesmo quick-xml; o encoding_rs já vem com outras dependências.
calamine = { version = "=0.38.0", default-features = false }
encoding_rs = "0.8"
# Portas em IPv4 e IPv6 ao mesmo tempo (IPV6_V6ONLY desligado também no Windows).
socket2 = "0.6"
# Uma só cópia do KanGest aberta (a segunda traz a janela da primeira para a frente) e o arranque automático ao ligar o
# computador (o servidor da loja). Série 2: o KanGest usa o Tauri 2.
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-autostart = "=2.7.0"
# Notificações do sistema (centro de notificações do macOS, avisos do Windows): o que falha em segundo plano.
tauri-plugin-notification = "=2.8.0"
# Janelas nativas de guardar e abrir (cópias de segurança, restauro, pasta externa).
tauri-plugin-dialog = "=2.8.4"

# Importação: as instâncias locais do SQL Server (registo do Windows). A mesma versão que já vem com o Tauri.
[target.'cfg(target_os = "windows")'.dependencies.winreg]
version = "0.55"

# Cofre do sistema para a chave mestra dos segredos: Porta-chaves no macOS e Gestor de Credenciais (DPAPI) no Windows.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
# SQLCipher no Windows: o OpenSSL compila-se junto (o Windows não o traz)
libsqlite3-sys = { version = "0.30", features = ["bundled-sqlcipher-vendored-openssl"] }

# Base de dados cifrada (SQLCipher, AES-256): o SQLite do sqlx passa a ser o SQLCipher. No macOS usa o CommonCrypto da
# Apple; no Linux (CI, desenvolvimento) o libcrypto do sistema.
[target.'cfg(not(target_os = "windows"))'.dependencies]
libsqlite3-sys = { version = "0.30", features = ["bundled-sqlcipher"] }
# OpenSSL do SQLCipher sem a limpeza à saída (db::iniciar_cripto): já vinha pelas outras dependências.
[target.'cfg(not(target_os = "macos"))'.dependencies]
openssl-sys = "0.9"

# Crypto e hashing ficam muito lentos sem optimizações em debug.
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# PBKDF2 da rede entre postos e AES/ChaCha dos segredos
[profile.dev.package.ring]
opt-level = 3
# o SQLite (SQLCipher) em C: sem optimização, os testes com a base ficam lentos
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
